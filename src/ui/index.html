<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SiftDB</title>
  <style>
    /* color-scheme makes the browser draw its own controls (the grid's native scrollbars, form fields) in the theme too. */
    :root { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }
    :root { --bg:#fff; --fg:#1f2328; --dim:#57606a; --panel:#f6f8fa; --line:#d0d7de; --accent:#0969da; --tab:#eaeef2; }
    :root[data-theme="dark"] { --bg:#0d1117; --fg:#e6edf3; --dim:#8b949e; --panel:#151b23; --line:#30363d; --accent:#4493f8; --tab:#1c232c; }
    /* Monaco's context menu is drawn outside the editor (in a shadow root on the body), where Monaco's own theme variables
       are not defined, so it came out transparent. Custom properties inherit into shadow roots, so its colours are defined
       here. They copy the Windows 11 menu that the tree shows (the browser's own, drawn by Windows; the grid's menu.ts uses them too), so every
       right-click menu in the app looks the same: a near-white or dark grey menu with a subtle grey highlight. */
    :root { --vscode-menu-background: #f9f9f9; --vscode-menu-foreground: #1a1a1a; --vscode-menu-border: #e5e5e5;
            --vscode-menu-selectionBackground: #ebebeb; --vscode-menu-selectionForeground: #1a1a1a;
            --vscode-menu-selectionBorder: transparent; --vscode-menu-separatorBackground: #e5e5e5;
            --vscode-widget-shadow: rgba(0,0,0,.18);
            /* Its shape too: Windows 11's 8px menu corners (4px on the highlighted item), no border, and a soft shadow. */
            --vscode-cornerRadius-large: 8px; --vscode-cornerRadius-medium: 4px; --vscode-strokeThickness: 0px;
            --vscode-shadow-lg: 0 8px 16px rgba(0,0,0,.14); }
    :root[data-theme="dark"] { --vscode-menu-background: #2c2c2c; --vscode-menu-foreground: #ffffff; --vscode-menu-border: #3d3d3d;
            --vscode-menu-selectionBackground: #383838; --vscode-menu-selectionForeground: #ffffff;
            --vscode-menu-separatorBackground: #3d3d3d; --vscode-widget-shadow: rgba(0,0,0,.45);
            --vscode-shadow-lg: 0 8px 16px rgba(0,0,0,.4); }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font: 13px "Segoe UI", sans-serif; }
    button { padding: 4px 12px; cursor: pointer; }
    input, textarea, button { color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
    button:disabled, input:disabled { opacity: 0.5; cursor: default; }
    [hidden] { display: none !important; }

    /* The app toolbar: the connection, and opening sheets. */
    .bar { display: flex; gap: 8px; align-items: center; padding: 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
    .bar input[type=text] { flex: 1; min-width: 0; padding: 4px 6px; }
    .bar .grow { flex: 1; }
    select { color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; }
    #connPick { min-width: 220px; max-width: 420px; }
    /* A downloaded update, waiting for a restart: the one accent-filled button, so it is noticed but never in the way. */
    /* Toolbar icon buttons: square, the icon in one colour that says what the action does (applyIcons in icons.ts). */
    button.ib { padding: 4px 6px; display: inline-flex; align-items: center; justify-content: center; line-height: 0; }
    /* A split button: the action, and a narrow ▾ beside it for the other ways to do it (Run | Dry run). One shape. */
    .split { display: inline-flex; }
    .split > button:first-child { border-top-right-radius: 0; border-bottom-right-radius: 0; }
    .split > button + button { border-top-left-radius: 0; border-bottom-left-radius: 0; border-left-width: 0; padding: 4px 3px; }
    .split > button + button svg { width: 11px; height: 11px; }
    .ticon { display: block; flex: none; }
    .ic-go { color: var(--tx-open); }        /* run, begin, end */
    .ic-commit { color: var(--tx-changed); } /* commit: amber, like changes pending */
    .ic-stop { color: var(--tx-failed); }    /* cancel, roll back */
    .ic-accent { color: var(--accent); }     /* connect */
    button.update { display: inline-flex; align-items: center; gap: 6px; }
    button.update { color: #fff; background: var(--accent); border-color: var(--accent); font-weight: 600; }
    /* Read-only shows the same way everywhere: a lock and words, never colour alone. */
    /* Read-only: a flat amber padlock on the tab; green chips on the sheet and the tree root. One colour each, no shading. */
    .lockicon { display: block; flex: none; }
    .tab .lock { flex: none; display: flex; color: var(--tx-changed); }
    .badge.ro { display: inline-flex; align-items: center; gap: 3px; color: var(--fg); border-color: var(--tx-open); background: var(--tx-open-bg); }
    /* Amber, so it stands out: on this sheet a change waits for Commit. */
    .autochip { font-size: 12px; padding: 1px 8px; border: 1px solid var(--tx-changed); border-radius: 10px; color: var(--fg); background: var(--tx-changed-bg); font-weight: 600; }
    .fcheck.off { opacity: 0.5; }
    .rochip { font-size: 12px; padding: 1px 8px; border: 1px solid var(--tx-open); border-radius: 10px; color: var(--fg); background: var(--tx-open-bg); font-weight: 600; }

    /* Connection form and password prompt. */
    dialog.modal { width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; padding: 0;
                   color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
                   box-shadow: 0 12px 40px rgba(0,0,0,.35); }
    dialog.modal.small { width: min(400px, calc(100vw - 32px)); }
    dialog.modal.wide { width: min(760px, calc(100vw - 32px)); }
    /* What's New (design section 14, F17): each release's notes, highlights first; a long list of fixes starts folded. */
    dialog.whatsnew { padding: 16px 20px; }
    dialog.whatsnew h2 { margin: 0 0 8px; }
    .whatsnewbody { max-height: calc(100vh - 180px); overflow: auto; margin-bottom: 12px; }
    .whatsnewbody .release { padding: 6px 0 10px; border-bottom: 1px solid var(--line); }
    .whatsnewbody .release:last-child { border-bottom: none; }
    .whatsnewbody h3 { margin: 6px 0; font-size: 15px; }
    .whatsnewbody details.notes { margin: 4px 0; }
    .whatsnewbody summary { cursor: pointer; font-weight: 600; padding: 2px 0; }
    .whatsnewbody details.breaking summary { color: var(--tx-changed); }
    .whatsnewbody ul { margin: 4px 0 6px; padding-left: 22px; }
    .whatsnewbody li { margin: 3px 0; line-height: 1.45; }
    .whatsnewbody code { font: 12px Consolas, "Cascadia Mono", monospace; padding: 0 3px; border-radius: 3px; background: var(--panel); }
    button.tryit { padding: 0 8px; font-size: 12px; margin-left: 4px; color: var(--accent); }
    /* After an update with only fixes: a notice, bottom left, for a moment. */
    .updatenotice { position: fixed; left: 12px; bottom: 12px; z-index: 40; display: flex; gap: 10px; align-items: center;
                    padding: 8px 12px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
                    border-left: 4px solid var(--accent); box-shadow: 0 6px 20px rgba(0,0,0,.25); }
    button.linkbtn { border: none; background: transparent; color: var(--accent); padding: 0 2px; }
    button.linkbtn:hover { text-decoration: underline; }
    /* Settings: categories on the left, the chosen one's page on the right. The body keeps one height across categories. */
    .settingsbody { display: flex; gap: 16px; min-height: 320px; }
    .settingsnav { flex: none; width: 150px; display: flex; flex-direction: column; gap: 2px; padding-right: 12px; border-right: 1px solid var(--line); }
    .settingsnav button { text-align: left; border: none; background: transparent; padding: 6px 10px; border-radius: 4px; color: var(--dim); }
    .settingsnav button:hover { background: var(--panel); color: var(--fg); }
    .settingsnav button[aria-selected="true"] { background: var(--panel); color: var(--fg); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
    .settingspages { flex: 1; min-width: 0; }
    .settingspage { display: flex; flex-direction: column; gap: 10px; }
    dialog.modal h3 { margin: 0; font-size: 14px; }
    /* Result styling rules: one ordered list. Each row shows an example cell in the rule's own colours. */
    .rulelist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; max-height: 340px; overflow: auto; }
    .rulerow { display: flex; align-items: center; gap: 10px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; }
    .rulerow.off .rulecell, .rulerow.off .ruletext { opacity: 0.5; }
    .rulegrip { flex: none; cursor: grab; color: var(--dim); font-size: 14px; line-height: 1; user-select: none; }
    .rulerow.dragging { opacity: 0.4; }
    .rulerow.dropbefore { box-shadow: inset 0 2px 0 var(--accent); }
    .rulerow.dropafter { box-shadow: inset 0 -2px 0 var(--accent); }
    .ruletext { flex: 1; min-width: 0; }
    .ruletext .fhelp { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rulename { font-weight: 600; }
    .rulecell { flex: none; display: inline-block; min-width: 64px; padding: 2px 8px; border-radius: 3px; font: 13px Consolas, "Cascadia Mono", monospace;
                border: 1px solid rgba(127,127,127,.35); text-align: center; }
    .ruleactions { flex: none; display: flex; gap: 2px; }
    .rulebtn { padding: 2px 7px; }
    .rulepreview { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; white-space: nowrap; }
    .typechecks { display: flex; flex-wrap: wrap; gap: 4px 12px; }
    .typecheck { white-space: nowrap; }
    .colours { align-items: center; gap: 16px; }
    .colours label { display: inline-flex; align-items: center; gap: 6px; }
    .colours input[type=color] { width: 44px; height: 26px; padding: 1px; }
    dialog.modal::backdrop { background: rgba(0,0,0,.4); }
    dialog.modal form { display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; }
    dialog.modal h2 { margin: 0; font-size: 16px; }
    dialog.modal p { margin: 0; }
    dialog.modal fieldset { margin: 0; padding: 8px 12px 10px; border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; gap: 8px; }
    dialog.modal legend { padding: 0 4px; color: var(--dim); font-size: 12px; }
    dialog.modal summary { cursor: pointer; color: var(--dim); }
    dialog.modal details[open] { display: flex; flex-direction: column; gap: 8px; }
    .fgroup { display: flex; flex-direction: column; gap: 8px; }
    .frow { display: grid; grid-template-columns: 110px 1fr; gap: 2px 10px; align-items: center; }
    .frow > input, .frow > select, .frow > .finline { min-width: 0; padding: 4px 6px; }
    .frow .fhelp { grid-column: 2; }
    .frow.off label { opacity: 0.5; }
    .finline { display: flex; gap: 6px; padding: 0 !important; }
    .finline input { flex: 1; min-width: 0; padding: 4px 6px; }
    .fhelp { color: var(--dim); font-size: 12px; }
    /* An editable dropdown (the connection form's Database): an input with a list button inside its right edge. */
    .fcombo { position: relative; min-width: 0; }
    .fcombo > input { width: 100%; padding: 4px 28px 4px 6px; }
    .fcombo-toggle { position: absolute; top: 1px; right: 1px; bottom: 1px; width: 26px; padding: 0; border: none;
                     border-radius: 0 3px 3px 0; background: transparent; color: var(--dim); display: flex; align-items: center; justify-content: center; }
    .fcombo-toggle:hover { color: var(--fg); background: var(--panel); }
    .fcombo-list { position: absolute; z-index: 10; top: calc(100% + 2px); left: 0; right: 0; max-height: 200px; overflow: auto;
                   margin: 0; padding: 4px 0; list-style: none; background: var(--bg); border: 1px solid var(--line); border-radius: 4px;
                   box-shadow: 0 4px 12px var(--vscode-widget-shadow); }
    .fcombo-list > li[role=option] { padding: 3px 8px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fcombo-list > li[role=option]:hover { background: var(--panel); }
    .fcombo-list > li[aria-selected=true] { background: var(--accent); color: #fff; }
    .fcombo-note { padding: 3px 8px; color: var(--dim); }
    .fcheck { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: center; }
    .fcheck .fhelp { grid-column: 2; }
    .mono { font-family: Consolas, monospace; }
    .fstatus { min-height: 20px; padding: 4px 8px; border-left: 4px solid transparent; }
    .fstatus:empty { padding: 0; border: none; min-height: 0; }
    .fstatus[data-kind="ok"] { border-left-color: var(--tx-open); background: var(--tx-open-bg); }
    .fstatus[data-kind="error"] { border-left-color: var(--tx-failed); background: var(--tx-failed-bg); }
    .factions { display: flex; gap: 8px; align-items: center; }
    .factions .grow { flex: 1; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    button.danger { color: var(--tx-failed); }

    #main { flex: 1; min-height: 0; display: flex; }
    #side { width: 300px; min-width: 160px; flex: none; display: flex; flex-direction: column; background: var(--bg); }
    /* Drag to resize the schema tree. The line is 1px; the hit area is wider. */
    #sidesplit { flex: none; width: 5px; margin: 0 -2px; position: relative; z-index: 2; cursor: col-resize; touch-action: none; }
    #sidesplit::after { content: ""; position: absolute; top: 0; bottom: 0; left: 2px; width: 1px; background: var(--line); }
    #sidesplit:hover::after, #sidesplit:focus-visible::after, #sidesplit.dragging::after { background: var(--accent); left: 1px; width: 3px; }
    #sidesplit:focus-visible { outline: none; }
    #side header { display: flex; gap: 6px; align-items: center; padding: 6px 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
    #side header input { flex: 1; min-width: 0; padding: 3px 6px; }
    #refresh { padding: 3px 8px; }
    #treeSummary { padding: 4px 8px; color: var(--dim); font-size: 12px; border-bottom: 1px solid var(--line); }
    #tree { flex: 1; min-height: 0; overflow: auto; padding: 4px 0; }
    .row { display: flex; gap: 6px; align-items: center; padding: 2px 8px; white-space: nowrap; cursor: default; user-select: none; }
    .row:hover { background: var(--panel); }
    /* A connection: the top level of the tree. The one the visible sheet is connected to is marked. */
    .row.root { font-weight: 600; }
    .row.root.current { box-shadow: inset 3px 0 0 var(--accent); }
    .twisty { width: 12px; flex: none; color: var(--dim); }
    .dim { color: var(--dim); }
    .badge { font-size: 10px; line-height: 14px; padding: 0 4px; border: 1px solid var(--line); border-radius: 3px; color: var(--dim); }
    /* The schema explorer (design section 14, F13). A row's detail is the dimmed tail: cut, not wrapped, when narrow. */
    #tree .row > .dim { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    #tree .row:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }
    /* A foreign key or "referenced by" entry: a click goes to that table. */
    #tree .row.jump { cursor: pointer; }
    #tree .tlink { color: var(--accent); }
    #tree .row.jump:hover .tlink { text-decoration: underline; }
    /* Where a jump landed. */
    #tree .row.jumped { background: color-mix(in srgb, var(--accent) 16%, transparent); }
    #tree .row[draggable="true"] { cursor: grab; }
    #tree .row.jump[draggable="true"] { cursor: pointer; }
    /* The filter's "columns too": pressed shows it is on. */
    #treeCols { padding: 3px 6px; font-size: 11px; }
    #treeCols[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* The right-hand area: a strip of sheet tabs, and the visible sheet filling the rest. */
    #work { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .tabstrip { display: flex; align-items: flex-end; gap: 2px; padding: 4px 6px 0; background: var(--panel); border-bottom: 1px solid var(--line); }
    /* Tabs shrink to a minimum width, then the strip scrolls (mouse wheel) with no scrollbar. overflow-x:auto forces overflow-y
       to auto too, so the strip is told to clip vertically; its bottom padding gives the active tab's 1px overlap room. */
    #tabs { display: flex; align-items: flex-end; gap: 2px; min-width: 0; margin-bottom: -1px; padding-bottom: 1px;
            overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
    #tabs::-webkit-scrollbar, .resulttabs::-webkit-scrollbar { display: none; }
    .tab { display: flex; align-items: center; gap: 6px; padding: 5px 4px 5px 12px; flex: 0 1 auto; min-width: 116px; max-width: 220px; white-space: nowrap; cursor: pointer;
           background: var(--tab); border: 1px solid var(--line); border-bottom: none; border-radius: 6px 6px 0 0; color: var(--dim); }
    .tab[aria-selected="true"] { background: var(--bg); color: var(--fg); font-weight: 600; margin-bottom: -1px; padding-bottom: 6px; }
    /* A sheet with changes waiting for Commit (amber) or a failed transaction waiting for Rollback (red): the whole tab is
       tinted, with a line along its top, selected or not. The dot and the tooltip say the same, so colour is not alone. */
    .tab.tx-changed { background: var(--tx-changed-bg); box-shadow: inset 0 2px 0 var(--tx-changed); color: var(--fg); }
    .tab.tx-failed { background: var(--tx-failed-bg); box-shadow: inset 0 2px 0 var(--tx-failed); color: var(--fg); }
    .tab .title { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    /* Unsaved edits: a dot after the name, in the text colour (no extra colour to learn). */
    /* The one "running" mark (sheet tabs, result tabs, the result status bar): a small ring in one colour. */
    .spinner { display: inline-block; flex: none; width: 10px; height: 10px; border: 2px solid var(--accent); border-right-color: transparent;
               border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; box-sizing: border-box; }
    .tab .running { flex: none; display: flex; }
    /* A long statement finished while you were on another sheet: its outcome, in its colour, until you look. */
    .tabdone { flex: none; font-size: 11px; font-weight: 700; line-height: 1; }
    .tabdone.complete { color: var(--tx-open); }
    .tabdone.error { color: var(--tx-failed); }
    .tabdone.cancelled { color: var(--tx-changed); }
    .tab .unsaved { flex: none; font-size: 10px; color: var(--fg); margin-left: -2px; }
    .tab .close, .rtab .close, .rtab .pin { border: none; background: transparent; padding: 0 5px; line-height: 1; color: var(--dim); border-radius: 3px; }
    .tab .close { font-size: 16px; }
    .tab .close:hover, .rtab .close:hover, .rtab .pin:hover { background: var(--line); color: var(--fg); }
    #newTab { flex: none; border: none; background: transparent; font-size: 18px; line-height: 1; padding: 2px 10px 6px; color: var(--dim); }
    #newTab:hover { color: var(--fg); }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .dot.tx-open { background: var(--tx-open); }
    .dot.tx-changed { background: var(--tx-changed); }
    .dot.tx-failed { background: var(--tx-failed); }

    #sheets { flex: 1; min-height: 0; position: relative; }
    .sheet { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
    .sheetbar { display: flex; gap: 8px; align-items: center; padding: 6px 8px; background: var(--panel); border-bottom: 1px solid var(--line); }

    /* Assisted | Strict: both options always shown, the active one filled, so the current mode is never a guess. */
    .modes { display: inline-flex; }
    .modes button { border-radius: 0; margin: 0; }
    .modes button:first-child { border-radius: 4px 0 0 4px; }
    .modes button:last-child { border-radius: 0 4px 4px 0; margin-left: -1px; }
    .modes button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; position: relative; }

    /* Transaction bar (design section 7). State is shown three ways: colour, icon and words. */
    :root { --tx-open: #1a7f37; --tx-changed: #9a6700; --tx-failed: #cf222e;
            --tx-open-bg: #dafbe1; --tx-changed-bg: #fff8c5; --tx-failed-bg: #ffebe9; }
    :root[data-theme="dark"] { --tx-open: #3fb950; --tx-changed: #d29922; --tx-failed: #f85149;
            --tx-open-bg: #12261e; --tx-changed-bg: #272115; --tx-failed-bg: #2d1214; }
    .txbar { display: flex; align-items: center; gap: 10px; padding: 5px 10px; border-bottom: 1px solid var(--line);
             border-left: 5px solid var(--accent); }
    .txbar.tx-open    { background: var(--tx-open-bg);    border-left-color: var(--tx-open); }
    .txbar.tx-changed { background: var(--tx-changed-bg); border-left-color: var(--tx-changed); }
    .txbar.tx-failed  { background: var(--tx-failed-bg);  border-left-color: var(--tx-failed); }
    .txbar.tx-open .txIcon    { color: var(--tx-open); }
    .txbar.tx-changed .txIcon { color: var(--tx-changed); }
    .txbar.tx-failed .txIcon  { color: var(--tx-failed); }
    .txIcon { font-size: 15px; width: 1.2em; text-align: center; }
    .txDetail { color: var(--dim); }
    .txbar .grow { flex: 1; }

    /* The missing-WHERE warning (design section 14, F1): red, above the editor, until Run anyway or Cancel. */
    .confirmbar { display: flex; align-items: center; gap: 10px; padding: 5px 10px; border-bottom: 1px solid var(--line);
                  border-left: 5px solid var(--tx-failed); background: var(--tx-failed-bg); color: var(--fg); }
    .confirmIcon { color: var(--tx-failed); font-size: 15px; width: 1.2em; text-align: center; flex: none; }
    .confirmText { min-width: 0; overflow-wrap: anywhere; line-height: 20px; }
    .confirmbar .grow { flex: 1; }
    .confirmbar button { flex: none; }

    .editor { height: 190px; min-height: 80px; overflow: hidden; flex: none; }
    /* Drag to give the editor or the results more room. The line is 1px; the hit area is wider. */
    .splitter { flex: none; height: 5px; margin: -2px 0; position: relative; z-index: 2; cursor: row-resize; touch-action: none; }
    .splitter::after { content: ""; position: absolute; left: 0; right: 0; top: 2px; height: 1px; background: var(--line); }
    .splitter:hover::after, .splitter:focus-visible::after, .splitter.dragging::after { background: var(--accent); top: 1px; height: 3px; }
    .splitter:focus-visible { outline: none; }
    .run-glyph { cursor: pointer; }
    .run-glyph::before { content: "▶"; display: flex; align-items: center; justify-content: center; height: 100%;
                         font-size: 10px; color: var(--accent); }
    /* Greyed quotes the editor adds in Assisted mode. Monaco's token colours are more specific, hence the selector. */
    .monaco-editor .view-line .sift-ghost { color: var(--dim) !important; opacity: 0.85; }
    /* The quick-fix menu sizes itself too narrowly for "Use \"PersonId\"": a fix you cannot read is no use. */
    .action-widget { min-width: 280px; }
    .current-statement { background: color-mix(in srgb, var(--accent) 10%, transparent); }

    /* The message bar between the editor and the results. Amber: cannot run yet. Red: failed. Neutral: information. */
    .msg { display: flex; align-items: flex-start; gap: 10px; padding: 6px 10px; color: var(--dim); background: var(--panel);
           border-bottom: 1px solid var(--line); border-left: 5px solid var(--line); line-height: 20px; }
    .msgIcon { flex: none; width: 1.2em; text-align: center; font-size: 14px; }
    .msgText { min-width: 0; overflow-wrap: anywhere; user-select: text; }
    .msg[data-kind="warning"] { color: var(--fg); background: var(--tx-changed-bg); border-left-color: var(--tx-changed); }
    .msg[data-kind="warning"] .msgIcon { color: var(--tx-changed); }
    .msg[data-kind="error"] { color: var(--fg); background: var(--tx-failed-bg); border-left-color: var(--tx-failed); }
    .msg[data-kind="error"] .msgIcon { color: var(--tx-failed); }

    /* Results: a tab per statement, labelled with the start of its SQL. Pinning keeps one past the next run. */
    .resulttabs { display: flex; align-items: flex-end; gap: 2px; padding: 4px 6px 1px; background: var(--panel); box-shadow: inset 0 -1px 0 var(--line);
                  min-height: 5px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; flex: none; }
    .rtab { display: flex; align-items: center; gap: 2px; padding: 3px 3px 3px 10px; flex: 0 1 auto; min-width: 136px; max-width: 260px; white-space: nowrap; cursor: pointer; font-size: 12px;
            background: var(--tab); border: 1px solid var(--line); border-bottom: none; border-radius: 5px 5px 0 0; color: var(--dim); }
    .rtab[aria-selected="true"] { background: var(--bg); color: var(--fg); margin-bottom: -1px; padding-bottom: 4px; }
    .rtab .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-family: Consolas, monospace; }
    .rtab .pin, .rtab .close { flex: none; }
    .rtab .pin { font-size: 11px; opacity: 0.4; }
    .rtab .pin[aria-pressed="true"] { opacity: 1; }
    .results { flex: 1; min-height: 0; position: relative; }
    .results .empty { padding: 16px; color: var(--dim); }
    .resultpanel { position: absolute; inset: 0; display: flex; flex-direction: column; }
    /* The status bar above a result: one line saying what happened. A failure is red, with an icon and words as well. */
    .status { flex: none; background: var(--panel); border-bottom: 1px solid var(--line); border-left: 5px solid var(--line); }
    .statusMain { display: flex; align-items: flex-start; gap: 10px; padding: 6px 10px; }
    .statusIcon { flex: none; width: 1.2em; text-align: center; font-size: 15px; line-height: 20px; color: var(--dim); }
    .statusText { flex: 1; min-width: 0; line-height: 20px; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
    .headline { font-weight: 600; }
    .extra { margin-left: 10px; color: var(--dim); }
    /* The status bar's icon buttons (Export, Details): toolbar icons, a little tighter to fit the one-line bar. */
    button.statusbtn { flex: none; padding: 2px 5px; gap: 4px; line-height: 1; font-size: 12px; font-variant-numeric: tabular-nums; }
    button.statusbtn > span:empty { display: none; }
    .details { margin: 0; padding: 5px 10px 7px 35px; border-top: 1px solid var(--line); color: var(--dim);
               font: 12px Consolas, monospace; white-space: pre-wrap; }
    .status[data-state="running"] { border-left-color: var(--accent); }
    .status[data-state="running"] .statusIcon { display: flex; align-items: center; justify-content: center; height: 20px; }
    .status[data-state="complete"] { border-left-color: var(--tx-open); }
    .status[data-state="complete"] .statusIcon { color: var(--tx-open); }
    .status[data-state="cancelled"] { border-left-color: var(--tx-changed); }
    .status[data-state="error"] { background: var(--tx-failed-bg); border-left-color: var(--tx-failed); }
    .status[data-state="error"] .statusIcon { color: var(--tx-failed); }
    .status[data-state="error"] .extra, .status[data-state="error"] .details { color: var(--fg); opacity: 0.75; }
    .status[data-state="error"] .details { border-top-color: var(--tx-failed); }
    /* A result from before an attempt that did not run: still readable, but plainly not the latest outcome. */
    .stalechip { display: inline-block; margin-right: 8px; padding: 0 7px; font-size: 11px; font-weight: 600; line-height: 18px;
                 border: 1px solid var(--line); border-radius: 9px; color: var(--fg); background: var(--bg); vertical-align: 1px; }
    .status.stale .statusIcon, .status.stale .headline, .status.stale .extra { opacity: 0.6; }
    .status.stale[data-state="error"] { background: var(--panel); }
    /* A dry run's result (design section 14, F2): striped amber, on its bar and its tab, so it is never taken for a real
       run's. Its controls: Before | After, the caveats mark, Run for real. */
    .status.dryrun, .rtab.dryrun {
      background-image: repeating-linear-gradient(135deg, var(--tx-changed-bg) 0 10px, transparent 10px 20px); }
    .status.dryrun[data-state="complete"] { border-left-color: var(--tx-changed); }
    .status.dryrun[data-state="complete"] .statusIcon { color: var(--tx-changed); }
    .dryctl { display: flex; align-items: center; gap: 8px; flex: none; }
    .dryctl .modes button { padding: 1px 9px; }
    .dryinfo { cursor: help; color: var(--tx-changed); font-size: 15px; line-height: 20px; }
    .dryctl button.danger { padding: 1px 10px; }
    /* A plan (design section 14, F6): the icicle graph or the steps table, with the picked step's details beside it. */
    .planctl { display: flex; align-items: center; gap: 8px; flex: none; }
    .planctl button { padding: 1px 9px; }
    .planbody { flex: 1; min-height: 0; display: flex; }
    .planmain { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .plangraph { flex: 1; min-height: 0; overflow: auto; position: relative; padding: 0; background: var(--bg); }
    .plangraph canvas { display: block; }
    .plangraph canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .plantip { position: absolute; z-index: 5; max-width: 360px; padding: 6px 8px; pointer-events: none; font-size: 12px;
               background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 4px;
               box-shadow: 0 4px 12px var(--vscode-widget-shadow); display: flex; flex-direction: column; gap: 2px; }
    .plantip strong { font-size: 13px; font-variant-numeric: tabular-nums; }
    .planlabel { color: var(--dim); overflow-wrap: anywhere; }
    .planwarn { color: var(--fg); }
    .plansteps { flex: 1; min-height: 0; overflow: auto; }
    .plansteps table { border-collapse: collapse; width: 100%; font-size: 12px; }
    .plansteps th { position: sticky; top: 0; background: var(--panel); text-align: left; font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--line); }
    .plansteps td { padding: 3px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .plansteps td.step { overflow: hidden; text-overflow: ellipsis; max-width: 0; width: 60%; }
    .plansteps td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .plansteps tr[data-id] { cursor: pointer; }
    .plansteps tr[data-id]:hover { background: var(--panel); }
    .plansteps tr[aria-selected="true"] { background: var(--tab); }
    .plandetail { flex: none; width: 300px; overflow: auto; border-left: 1px solid var(--line); padding: 8px 10px;
                  display: flex; flex-direction: column; gap: 4px; font-size: 12px; background: var(--bg); }
    .plandetail h3 { margin: 0 0 2px; font-size: 13px; }
    .plandetail strong { font-size: 13px; font-variant-numeric: tabular-nums; }
    .plandetail .planwarn { margin-top: 4px; padding: 4px 6px; border-left: 3px solid var(--tx-changed); background: var(--tx-changed-bg); }
    .plandetail button { align-self: flex-start; margin-top: 4px; padding: 2px 10px; }
    .plandetail details { margin-top: 6px; }
    .plandetail summary { cursor: pointer; color: var(--dim); }
    .plandetail dl { margin: 4px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; }
    .plandetail dt { color: var(--dim); }
    .plandetail dd { margin: 0; overflow-wrap: anywhere; font-family: Consolas, monospace; }
    .monaco-editor .plan-link { background: var(--tab); outline: 1px dashed var(--fg); }
    /* Settings › About: Check for updates, Restart to update, and what the check found, on one line that wraps. */
    .updaterow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .updatestatus { color: var(--dim); }
    /* The query mini-map (design section 14, F5): over the editor's top right, clear of its scrollbar. Small, and it scrolls
       when a statement has more tables than fit. Red is only ever with ⚠, never the only signal. */
    .sheet .editor { position: relative; }
    .minimap { position: absolute; top: 4px; right: 18px; z-index: 5; max-width: min(45%, 460px); max-height: calc(100% - 8px); overflow: auto;
               background: color-mix(in srgb, var(--bg) 94%, transparent); border: 1px solid var(--line); border-radius: 4px;
               box-shadow: 0 2px 8px rgba(0,0,0,.12); font: 11px system-ui, sans-serif; color: var(--fg); }
    .minimap.collapsed { background: transparent; border: none; box-shadow: none; overflow: visible; }
    .minimap-head { display: flex; align-items: center; gap: 6px; padding: 1px 2px 1px 8px; color: var(--dim); border-bottom: 1px solid var(--line); }
    .minimap-head > span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .minimap .warn { color: var(--tx-failed); }
    .minimap-toggle { border: none; background: transparent; color: var(--dim); padding: 0 6px; font: inherit; line-height: 16px; cursor: pointer; }
    .minimap.collapsed .minimap-toggle { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 1px 8px; }
    .minimap.collapsed .minimap-toggle.warn { color: var(--tx-failed); border-color: var(--tx-failed); }
    .minimap svg { display: block; max-width: 100%; height: auto; }
    .minimap.greyed svg { opacity: .45; }
    /* Kind colours: a categorical set validated for colour-blind separation in both themes (each theme has its own steps).
       Boxes: tables blue, views orange, CTEs and subqueries aqua; a function or an unknown name stays neutral. Lines: joins
       violet, a suggested join magenta. Red is the warning's alone. Each colour comes with an icon or text, never alone. */
    :root { --mm-table: #2a78d6; --mm-view: #eb6834; --mm-query: #1baf7a; --mm-other: #8c959f; --mm-join: #6250d6; --mm-suggest: #e87ba4; }
    :root[data-theme="dark"] { --mm-table: #3987e5; --mm-view: #d95926; --mm-query: #199e70; --mm-other: #6e7681; --mm-join: #9085e9; --mm-suggest: #d55181; }
    .mm-node { --k: var(--mm-other); }
    .mm-node.table, .mm-node.foreignTable { --k: var(--mm-table); }
    .mm-node.view, .mm-node.materializedView { --k: var(--mm-view); }
    .mm-node.cte, .mm-node.derived { --k: var(--mm-query); }
    .mm-node rect { fill: color-mix(in srgb, var(--k) 14%, var(--bg)); stroke: color-mix(in srgb, var(--k) 70%, var(--bg)); }
    .mm-node .mm-icon path { fill: none; stroke: var(--k); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
    .mm-node text { fill: var(--fg); font-size: 11px; }
    .mm-node .mm-sub { fill: var(--dim); }
    .mm-node.unknown text { font-style: italic; }
    .mm-node.cte rect, .mm-node.derived rect, .mm-node.function rect { stroke-dasharray: 3 2; }
    .mm-node.target rect { stroke: var(--k); stroke-width: 2.2; }
    .mm-node.target .mm-mark { fill: var(--fg); }
    .mm-node.warn rect { stroke: var(--tx-failed); stroke-width: 1.8; stroke-dasharray: none; }
    .mm-node.warn .mm-mark { fill: var(--tx-failed); }
    .mm-node[tabindex] { cursor: pointer; }
    .mm-node[tabindex]:hover rect, .mm-node:focus-visible rect { stroke: var(--k); stroke-width: 2.4; fill: color-mix(in srgb, var(--k) 24%, var(--bg)); }
    .mm-node:focus, .mm-edge:focus { outline: none; }
    .mm-edge { --e: var(--mm-join); }
    .mm-edge.suggested { --e: var(--mm-suggest); }
    .mm-edge.cross { --e: var(--mm-other); }
    .mm-edge .mm-line { fill: none; stroke: var(--e); stroke-width: 1.8; }
    .mm-edge .mm-hit { fill: none; stroke: transparent; stroke-width: 10; }
    .mm-edge.cross .mm-line { stroke-width: 1.4; stroke-dasharray: 2 3; }
    .mm-edge.suggested .mm-line { stroke-dasharray: 5 4; }
    .mm-edge:hover .mm-line, .mm-edge:focus-visible .mm-line { stroke-width: 3; }
    /* Labels wear text colours; the line beside them carries the kind. */
    .mm-edge-label { fill: var(--dim); font-size: 9.5px; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
    .mm-edge:hover .mm-edge-label, .mm-edge:focus-visible .mm-edge-label { fill: var(--fg); }
    .mm-edge.clickable { cursor: pointer; }
    .mm-group { fill: none; stroke: var(--line); stroke-dasharray: 4 3; }
    .mm-group-label { fill: var(--dim); font-size: 10px; }
    .monaco-editor .map-link { background: color-mix(in srgb, var(--accent) 22%, transparent); outline: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); }
    @media (max-width: 700px) { .plandetail { width: 200px; } }
    /* The command palette's host (design section 14, F12): the whole window, so Monaco's quick-input widget is centred
       over the app as in VS Code. Only the widget itself takes the mouse. */
    .siftdb-quickinput { position: fixed; inset: 0; z-index: 1000; pointer-events: none; }
    .siftdb-quickinput .quick-input-widget { pointer-events: auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

    /* The same cues on a result's tab, so a failure shows with several tabs open. */
    .rtab .mark { flex: none; font-size: 11px; margin-right: 5px; }
    .rtab[data-state="error"] { border-top: 2px solid var(--tx-failed); }
    .rtab[data-state="error"] .mark { color: var(--tx-failed); }
    .rtab[data-state="running"] .mark { display: inline-flex; align-items: center; }
    .grid { flex: 1; min-height: 0; }
    /* The grid draws its own focus (the outlined cell, the selection turning from grey to the accent), so no box round it. */
    .grid:focus { outline: none; }
    .srOnly { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

    /* A cut-off value, whole, on hover. Monospaced like the cell, line breaks kept, long ones cut short. */
    .gridtip { position: fixed; z-index: 50; max-width: min(640px, calc(100vw - 8px)); padding: 6px 8px; pointer-events: none;
               background: var(--vscode-menu-background); color: var(--vscode-menu-foreground); border-radius: 6px;
               box-shadow: var(--vscode-shadow-lg), 0 0 0 1px var(--vscode-menu-border); }
    .gridtip .tiptext { font: 13px Consolas, "Cascadia Mono", monospace; white-space: pre-wrap; overflow-wrap: anywhere;
                        max-height: 320px; overflow: hidden; }
    .gridtip .tipmore { margin-top: 6px; color: var(--dim); font-size: 12px; }
    /* Hovering a foreign key (design section 14, F4): the row it points at, its first few columns as name and value. */
    .peekcard { min-width: 220px; }
    .peekcard .peekhead { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
    .peekcard .peeknote { color: var(--tx-changed); font-size: 12px; }
    .peekcard table { border-collapse: collapse; font: 12px Consolas, "Cascadia Mono", monospace; }
    .peekcard td { padding: 1px 10px 1px 0; vertical-align: top; max-width: 420px; overflow-wrap: anywhere; }
    .peekcard td:first-child { color: var(--dim); white-space: nowrap; }
    .peekcard td.null { color: var(--dim); font-style: italic; }
    /* "Copied 3 rows × 2 columns": bottom right of the grid for a moment. */
    .gridtoast { position: fixed; z-index: 50; padding: 5px 10px; border-radius: 6px; pointer-events: none;
                 background: var(--vscode-menu-background); color: var(--vscode-menu-foreground);
                 box-shadow: var(--vscode-shadow-lg), 0 0 0 1px var(--vscode-menu-border); }
    .gridtoast[data-tone="warn"] { color: var(--tx-changed); box-shadow: var(--vscode-shadow-lg), 0 0 0 1px var(--tx-changed); }

    /* The grid's right-click menu, drawn like Monaco's and the Windows 11 one (see the --vscode-menu-* colours above). */
    .menu { position: fixed; z-index: 60; min-width: 220px; padding: 4px; display: flex; flex-direction: column;
            background: var(--vscode-menu-background); color: var(--vscode-menu-foreground); border-radius: 8px;
            box-shadow: var(--vscode-shadow-lg), 0 0 0 1px var(--vscode-menu-border); }
    .menu button { display: flex; gap: 24px; justify-content: space-between; text-align: left; padding: 5px 10px;
                   border: none; border-radius: 4px; background: transparent; color: inherit; }
    .menu button:hover:not(:disabled), .menu button:focus-visible { background: var(--vscode-menu-selectionBackground); outline: none; }
    .menu .shortcut { color: var(--dim); }
    .menu .sep { height: 1px; margin: 4px 6px; background: var(--vscode-menu-separatorBackground); }

    /* The value viewer. */
    textarea.valuetext { width: 100%; height: min(420px, calc(100vh - 220px)); resize: vertical; padding: 8px;
                         font: 13px Consolas, "Cascadia Mono", monospace; }
    .nullvalue { font: italic 14px Consolas, "Cascadia Mono", monospace; color: var(--dim); }
    label.check { display: inline-flex; align-items: center; gap: 6px; }
  </style>
</head>
<body>
  <div class="bar">
    <select id="connPick" aria-label="Connection for this sheet"></select>
    <input id="conn" type="text" hidden placeholder="Host=localhost;Username=postgres;Password=…;Database=postgres" spellcheck="false" aria-label="Connection string">
    <button id="connect" class="ib ic-accent" data-icon="connect" aria-label="Connect" title="Connect the visible sheet. Other sheets keep their own connections."></button>
    <button id="editConn" class="ib" data-icon="edit" aria-label="Edit connection" title="Edit the selected saved connection"></button>
    <button id="saveAs" class="ib" data-icon="saveConnection" hidden aria-label="Save connection as" title="Save this connection string as a named connection"></button>
    <button id="newConn" class="ib" data-icon="newConnection" aria-label="New connection" title="New saved connection"></button>
    <span class="grow"></span>
    <button id="openFile" class="ib" data-icon="open" aria-label="Open file" title="Open a .sql file in a sheet (Ctrl+O)"></button>
    <button id="saveFile" class="ib" data-icon="save" aria-label="Save" title="Save the visible sheet (Ctrl+S). Ctrl+Shift+S saves it under a new name."></button>
    <button id="newSheet" class="ib" data-icon="newSheet" aria-label="New sheet" title="Open a new SQL sheet in a new tab (Ctrl+T). Each sheet has its own session."></button>
    <button id="update" class="update" data-icon="download" hidden><span class="label">Restart to update</span></button>
    <button id="settings" class="ib" data-icon="settings" aria-label="Settings" title="Settings (Ctrl+,)"></button>
  </div>
  <div id="main">
    <aside id="side" aria-label="Schema browser">
      <header>
        <input id="treeFilter" type="text" placeholder="Filter tables…" spellcheck="false" aria-label="Filter tables" disabled>
        <button id="treeCols" aria-pressed="false" disabled title="Match column names too: tables with a matching column show, opened on those columns" aria-label="Match column names too">Cols</button>
        <button id="refresh" title="Reload schema" aria-label="Reload schema" disabled>⟳</button>
      </header>
      <div id="treeSummary">Not connected.</div>
      <div id="tree"></div>
    </aside>
    <div id="sidesplit" role="separator" aria-orientation="vertical" aria-label="Resize schema browser" tabindex="0" title="Drag to resize (or use the left and right arrow keys). Double-click to reset."></div>
    <div id="work">
      <div class="tabstrip">
        <div id="tabs" role="tablist" aria-label="Sheets"></div>
        <button id="newTab" title="New sheet (Ctrl+T)" aria-label="New sheet">+</button>
      </div>
      <div id="sheets"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
