<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SiftDB</title>
  <style>
    /* color-scheme makes the browser draw its own controls (the grid's native scrollbars, form fields) in the theme too. */
    :root { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }
    :root { --bg:#fff; --fg:#1f2328; --dim:#57606a; --panel:#f6f8fa; --line:#d0d7de; --accent:#0969da; --tab:#eaeef2; }
    :root[data-theme="dark"] { --bg:#0d1117; --fg:#e6edf3; --dim:#8b949e; --panel:#151b23; --line:#30363d; --accent:#4493f8; --tab:#1c232c; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font: 13px "Segoe UI", sans-serif; }
    button { padding: 4px 12px; cursor: pointer; }
    input, textarea, button { color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
    button:disabled, input:disabled { opacity: 0.5; cursor: default; }
    [hidden] { display: none !important; }

    /* The app toolbar: the connection, and opening sheets. */
    .bar { display: flex; gap: 8px; align-items: center; padding: 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
    .bar input[type=text] { flex: 1; min-width: 0; padding: 4px 6px; }
    .bar .grow { flex: 1; }
    select { color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; }
    #connPick { min-width: 220px; max-width: 420px; }
    /* Read-only shows the same way everywhere: a lock and words, never colour alone. */
    /* Read-only: a flat amber padlock on the tab; green chips on the sheet and the tree root. One colour each, no shading. */
    .lockicon { display: block; flex: none; }
    .tab .lock { flex: none; display: flex; color: var(--tx-changed); }
    .badge.ro { display: inline-flex; align-items: center; gap: 3px; color: var(--fg); border-color: var(--tx-open); background: var(--tx-open-bg); }
    /* Amber, so it stands out: on this sheet a change waits for Commit. */
    .autochip { font-size: 12px; padding: 1px 8px; border: 1px solid var(--tx-changed); border-radius: 10px; color: var(--fg); background: var(--tx-changed-bg); font-weight: 600; }
    .fcheck.off { opacity: 0.5; }
    .rochip { font-size: 12px; padding: 1px 8px; border: 1px solid var(--tx-open); border-radius: 10px; color: var(--fg); background: var(--tx-open-bg); font-weight: 600; }

    /* Connection form and password prompt. */
    dialog.modal { width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; padding: 0;
                   color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
                   box-shadow: 0 12px 40px rgba(0,0,0,.35); }
    dialog.modal.small { width: min(400px, calc(100vw - 32px)); }
    dialog.modal.wide { width: min(760px, calc(100vw - 32px)); }
    /* Settings: categories on the left, the chosen one's page on the right. The body keeps one height across categories. */
    .settingsbody { display: flex; gap: 16px; min-height: 320px; }
    .settingsnav { flex: none; width: 150px; display: flex; flex-direction: column; gap: 2px; padding-right: 12px; border-right: 1px solid var(--line); }
    .settingsnav button { text-align: left; border: none; background: transparent; padding: 6px 10px; border-radius: 4px; color: var(--dim); }
    .settingsnav button:hover { background: var(--panel); color: var(--fg); }
    .settingsnav button[aria-selected="true"] { background: var(--panel); color: var(--fg); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
    .settingspages { flex: 1; min-width: 0; }
    .settingspage { display: flex; flex-direction: column; gap: 10px; }
    dialog.modal h3 { margin: 0; font-size: 14px; }
    /* Result styling rules: one ordered list. Each row shows an example cell in the rule's own colours. */
    .rulelist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; max-height: 340px; overflow: auto; }
    .rulerow { display: flex; align-items: center; gap: 10px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; }
    .rulerow.off .rulecell, .rulerow.off .ruletext { opacity: 0.5; }
    .ruletext { flex: 1; min-width: 0; }
    .ruletext .fhelp { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rulename { font-weight: 600; }
    .rulecell { flex: none; display: inline-block; min-width: 64px; padding: 2px 8px; border-radius: 3px; font: 13px Consolas, "Cascadia Mono", monospace;
                border: 1px solid rgba(127,127,127,.35); text-align: center; }
    .ruleactions { flex: none; display: flex; gap: 2px; }
    .rulebtn { padding: 2px 7px; }
    .rulepreview { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; white-space: nowrap; }
    .typechecks { display: flex; flex-wrap: wrap; gap: 4px 12px; }
    .typecheck { white-space: nowrap; }
    .colours { align-items: center; gap: 16px; }
    .colours label { display: inline-flex; align-items: center; gap: 6px; }
    .colours input[type=color] { width: 44px; height: 26px; padding: 1px; }
    dialog.modal::backdrop { background: rgba(0,0,0,.4); }
    dialog.modal form { display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; }
    dialog.modal h2 { margin: 0; font-size: 16px; }
    dialog.modal p { margin: 0; }
    dialog.modal fieldset { margin: 0; padding: 8px 12px 10px; border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; gap: 8px; }
    dialog.modal legend { padding: 0 4px; color: var(--dim); font-size: 12px; }
    dialog.modal summary { cursor: pointer; color: var(--dim); }
    dialog.modal details[open] { display: flex; flex-direction: column; gap: 8px; }
    .fgroup { display: flex; flex-direction: column; gap: 8px; }
    .frow { display: grid; grid-template-columns: 110px 1fr; gap: 2px 10px; align-items: center; }
    .frow > input, .frow > select, .frow > .finline { min-width: 0; padding: 4px 6px; }
    .frow .fhelp { grid-column: 2; }
    .frow.off label { opacity: 0.5; }
    .finline { display: flex; gap: 6px; padding: 0 !important; }
    .finline input { flex: 1; min-width: 0; padding: 4px 6px; }
    .fhelp { color: var(--dim); font-size: 12px; }
    .fcheck { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: center; }
    .fcheck .fhelp { grid-column: 2; }
    .mono { font-family: Consolas, monospace; }
    .fstatus { min-height: 20px; padding: 4px 8px; border-left: 4px solid transparent; }
    .fstatus:empty { padding: 0; border: none; min-height: 0; }
    .fstatus[data-kind="ok"] { border-left-color: var(--tx-open); background: var(--tx-open-bg); }
    .fstatus[data-kind="error"] { border-left-color: var(--tx-failed); background: var(--tx-failed-bg); }
    .factions { display: flex; gap: 8px; align-items: center; }
    .factions .grow { flex: 1; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    button.danger { color: var(--tx-failed); }

    #main { flex: 1; min-height: 0; display: flex; }
    #side { width: 300px; min-width: 160px; flex: none; display: flex; flex-direction: column; background: var(--bg); }
    /* Drag to resize the schema tree. The line is 1px; the hit area is wider. */
    #sidesplit { flex: none; width: 5px; margin: 0 -2px; position: relative; z-index: 2; cursor: col-resize; touch-action: none; }
    #sidesplit::after { content: ""; position: absolute; top: 0; bottom: 0; left: 2px; width: 1px; background: var(--line); }
    #sidesplit:hover::after, #sidesplit:focus-visible::after, #sidesplit.dragging::after { background: var(--accent); left: 1px; width: 3px; }
    #sidesplit:focus-visible { outline: none; }
    #side header { display: flex; gap: 6px; align-items: center; padding: 6px 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
    #side header input { flex: 1; min-width: 0; padding: 3px 6px; }
    #refresh { padding: 3px 8px; }
    #treeSummary { padding: 4px 8px; color: var(--dim); font-size: 12px; border-bottom: 1px solid var(--line); }
    #tree { flex: 1; min-height: 0; overflow: auto; padding: 4px 0; }
    .row { display: flex; gap: 6px; align-items: center; padding: 2px 8px; white-space: nowrap; cursor: default; user-select: none; }
    .row:hover { background: var(--panel); }
    /* A connection: the top level of the tree. The one the visible sheet is connected to is marked. */
    .row.root { font-weight: 600; }
    .row.root.current { box-shadow: inset 3px 0 0 var(--accent); }
    .twisty { width: 12px; flex: none; color: var(--dim); }
    .dim { color: var(--dim); }
    .badge { font-size: 10px; line-height: 14px; padding: 0 4px; border: 1px solid var(--line); border-radius: 3px; color: var(--dim); }

    /* The right-hand area: a strip of sheet tabs, and the visible sheet filling the rest. */
    #work { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .tabstrip { display: flex; align-items: flex-end; gap: 2px; padding: 4px 6px 0; background: var(--panel); border-bottom: 1px solid var(--line); }
    /* Tabs shrink to a minimum width, then the strip scrolls (mouse wheel) with no scrollbar. overflow-x:auto forces overflow-y
       to auto too, so the strip is told to clip vertically; its bottom padding gives the active tab's 1px overlap room. */
    #tabs { display: flex; align-items: flex-end; gap: 2px; min-width: 0; margin-bottom: -1px; padding-bottom: 1px;
            overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
    #tabs::-webkit-scrollbar, .resulttabs::-webkit-scrollbar { display: none; }
    .tab { display: flex; align-items: center; gap: 6px; padding: 5px 4px 5px 12px; flex: 0 1 auto; min-width: 116px; max-width: 220px; white-space: nowrap; cursor: pointer;
           background: var(--tab); border: 1px solid var(--line); border-bottom: none; border-radius: 6px 6px 0 0; color: var(--dim); }
    .tab[aria-selected="true"] { background: var(--bg); color: var(--fg); font-weight: 600; margin-bottom: -1px; padding-bottom: 6px; }
    .tab .title { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    /* Unsaved edits: a dot after the name, in the text colour (no extra colour to learn). */
    /* The one "running" mark (sheet tabs, result tabs, the result status bar): a small ring in one colour. */
    .spinner { display: inline-block; flex: none; width: 10px; height: 10px; border: 2px solid var(--accent); border-right-color: transparent;
               border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; box-sizing: border-box; }
    .tab .running { flex: none; display: flex; }
    /* A long statement finished while you were on another sheet: its outcome, in its colour, until you look. */
    .tabdone { flex: none; font-size: 11px; font-weight: 700; line-height: 1; }
    .tabdone.complete { color: var(--tx-open); }
    .tabdone.error { color: var(--tx-failed); }
    .tabdone.cancelled { color: var(--tx-changed); }
    .tab .unsaved { flex: none; font-size: 10px; color: var(--fg); margin-left: -2px; }
    .tab .close, .rtab .close, .rtab .pin { border: none; background: transparent; padding: 0 5px; line-height: 1; color: var(--dim); border-radius: 3px; }
    .tab .close { font-size: 16px; }
    .tab .close:hover, .rtab .close:hover, .rtab .pin:hover { background: var(--line); color: var(--fg); }
    #newTab { flex: none; border: none; background: transparent; font-size: 18px; line-height: 1; padding: 2px 10px 6px; color: var(--dim); }
    #newTab:hover { color: var(--fg); }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .dot.tx-open { background: var(--tx-open); }
    .dot.tx-changed { background: var(--tx-changed); }
    .dot.tx-failed { background: var(--tx-failed); }

    #sheets { flex: 1; min-height: 0; position: relative; }
    .sheet { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
    .sheetbar { display: flex; gap: 8px; align-items: center; padding: 6px 8px; background: var(--panel); border-bottom: 1px solid var(--line); }

    /* Assisted | Strict: both options always shown, the active one filled, so the current mode is never a guess. */
    .modes { display: inline-flex; }
    .modes button { border-radius: 0; margin: 0; }
    .modes button:first-child { border-radius: 4px 0 0 4px; }
    .modes button:last-child { border-radius: 0 4px 4px 0; margin-left: -1px; }
    .modes button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; position: relative; }

    /* Transaction bar (design section 7). State is shown three ways: colour, icon and words. */
    :root { --tx-open: #1a7f37; --tx-changed: #9a6700; --tx-failed: #cf222e;
            --tx-open-bg: #dafbe1; --tx-changed-bg: #fff8c5; --tx-failed-bg: #ffebe9; }
    :root[data-theme="dark"] { --tx-open: #3fb950; --tx-changed: #d29922; --tx-failed: #f85149;
            --tx-open-bg: #12261e; --tx-changed-bg: #272115; --tx-failed-bg: #2d1214; }
    .txbar { display: flex; align-items: center; gap: 10px; padding: 5px 10px; border-bottom: 1px solid var(--line);
             border-left: 5px solid var(--accent); }
    .txbar.tx-open    { background: var(--tx-open-bg);    border-left-color: var(--tx-open); }
    .txbar.tx-changed { background: var(--tx-changed-bg); border-left-color: var(--tx-changed); }
    .txbar.tx-failed  { background: var(--tx-failed-bg);  border-left-color: var(--tx-failed); }
    .txbar.tx-open .txIcon    { color: var(--tx-open); }
    .txbar.tx-changed .txIcon { color: var(--tx-changed); }
    .txbar.tx-failed .txIcon  { color: var(--tx-failed); }
    .txIcon { font-size: 15px; width: 1.2em; text-align: center; }
    .txDetail { color: var(--dim); }
    .txbar .grow { flex: 1; }

    .editor { height: 190px; min-height: 80px; overflow: hidden; flex: none; }
    /* Drag to give the editor or the results more room. The line is 1px; the hit area is wider. */
    .splitter { flex: none; height: 5px; margin: -2px 0; position: relative; z-index: 2; cursor: row-resize; touch-action: none; }
    .splitter::after { content: ""; position: absolute; left: 0; right: 0; top: 2px; height: 1px; background: var(--line); }
    .splitter:hover::after, .splitter:focus-visible::after, .splitter.dragging::after { background: var(--accent); top: 1px; height: 3px; }
    .splitter:focus-visible { outline: none; }
    .run-glyph { cursor: pointer; }
    .run-glyph::before { content: "▶"; display: flex; align-items: center; justify-content: center; height: 100%;
                         font-size: 10px; color: var(--accent); }
    /* Greyed quotes the editor adds in Assisted mode. Monaco's token colours are more specific, hence the selector. */
    .monaco-editor .view-line .sift-ghost { color: var(--dim) !important; opacity: 0.85; }
    /* The quick-fix menu sizes itself too narrowly for "Use \"PersonId\"": a fix you cannot read is no use. */
    .action-widget { min-width: 280px; }
    .current-statement { background: color-mix(in srgb, var(--accent) 10%, transparent); }

    /* The message bar between the editor and the results. Amber: cannot run yet. Red: failed. Neutral: information. */
    .msg { display: flex; align-items: flex-start; gap: 10px; padding: 6px 10px; color: var(--dim); background: var(--panel);
           border-bottom: 1px solid var(--line); border-left: 5px solid var(--line); line-height: 20px; }
    .msgIcon { flex: none; width: 1.2em; text-align: center; font-size: 14px; }
    .msgText { min-width: 0; overflow-wrap: anywhere; user-select: text; }
    .msg[data-kind="warning"] { color: var(--fg); background: var(--tx-changed-bg); border-left-color: var(--tx-changed); }
    .msg[data-kind="warning"] .msgIcon { color: var(--tx-changed); }
    .msg[data-kind="error"] { color: var(--fg); background: var(--tx-failed-bg); border-left-color: var(--tx-failed); }
    .msg[data-kind="error"] .msgIcon { color: var(--tx-failed); }

    /* Results: a tab per statement, labelled with the start of its SQL. Pinning keeps one past the next run. */
    .resulttabs { display: flex; align-items: flex-end; gap: 2px; padding: 4px 6px 1px; background: var(--panel); box-shadow: inset 0 -1px 0 var(--line);
                  min-height: 5px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; flex: none; }
    .rtab { display: flex; align-items: center; gap: 2px; padding: 3px 3px 3px 10px; flex: 0 1 auto; min-width: 136px; max-width: 260px; white-space: nowrap; cursor: pointer; font-size: 12px;
            background: var(--tab); border: 1px solid var(--line); border-bottom: none; border-radius: 5px 5px 0 0; color: var(--dim); }
    .rtab[aria-selected="true"] { background: var(--bg); color: var(--fg); margin-bottom: -1px; padding-bottom: 4px; }
    .rtab .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-family: Consolas, monospace; }
    .rtab .pin, .rtab .close { flex: none; }
    .rtab .pin { font-size: 11px; opacity: 0.4; }
    .rtab .pin[aria-pressed="true"] { opacity: 1; }
    .results { flex: 1; min-height: 0; position: relative; }
    .results .empty { padding: 16px; color: var(--dim); }
    .resultpanel { position: absolute; inset: 0; display: flex; flex-direction: column; }
    /* The status bar above a result: one line saying what happened. A failure is red, with an icon and words as well. */
    .status { flex: none; background: var(--panel); border-bottom: 1px solid var(--line); border-left: 5px solid var(--line); }
    .statusMain { display: flex; align-items: flex-start; gap: 10px; padding: 6px 10px; }
    .statusIcon { flex: none; width: 1.2em; text-align: center; font-size: 15px; line-height: 20px; color: var(--dim); }
    .statusText { flex: 1; min-width: 0; line-height: 20px; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
    .headline { font-weight: 600; }
    .extra { margin-left: 10px; color: var(--dim); }
    .statusToggle { flex: none; padding: 1px 9px; font-size: 12px; }
    .details { margin: 0; padding: 5px 10px 7px 35px; border-top: 1px solid var(--line); color: var(--dim);
               font: 12px Consolas, monospace; white-space: pre-wrap; }
    .status[data-state="running"] { border-left-color: var(--accent); }
    .status[data-state="running"] .statusIcon { display: flex; align-items: center; justify-content: center; height: 20px; }
    .status[data-state="complete"] { border-left-color: var(--tx-open); }
    .status[data-state="complete"] .statusIcon { color: var(--tx-open); }
    .status[data-state="cancelled"] { border-left-color: var(--tx-changed); }
    .status[data-state="error"] { background: var(--tx-failed-bg); border-left-color: var(--tx-failed); }
    .status[data-state="error"] .statusIcon { color: var(--tx-failed); }
    .status[data-state="error"] .extra, .status[data-state="error"] .details { color: var(--fg); opacity: 0.75; }
    .status[data-state="error"] .details { border-top-color: var(--tx-failed); }
    /* A result from before an attempt that did not run: still readable, but plainly not the latest outcome. */
    .stalechip { display: inline-block; margin-right: 8px; padding: 0 7px; font-size: 11px; font-weight: 600; line-height: 18px;
                 border: 1px solid var(--line); border-radius: 9px; color: var(--fg); background: var(--bg); vertical-align: 1px; }
    .status.stale .statusIcon, .status.stale .headline, .status.stale .extra { opacity: 0.6; }
    .status.stale[data-state="error"] { background: var(--panel); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

    /* The same cues on a result's tab, so a failure shows with several tabs open. */
    .rtab .mark { flex: none; font-size: 11px; margin-right: 5px; }
    .rtab[data-state="error"] { border-top: 2px solid var(--tx-failed); }
    .rtab[data-state="error"] .mark { color: var(--tx-failed); }
    .rtab[data-state="running"] .mark { display: inline-flex; align-items: center; }
    .grid { flex: 1; min-height: 0; }
  </style>
</head>
<body>
  <div class="bar">
    <select id="connPick" aria-label="Connection for this sheet"></select>
    <input id="conn" type="text" hidden placeholder="Host=localhost;Username=postgres;Password=…;Database=postgres" spellcheck="false" aria-label="Connection string">
    <button id="connect" title="Connect the visible sheet. Other sheets keep their own connections.">Connect</button>
    <button id="editConn" title="Edit the selected saved connection">Edit…</button>
    <button id="saveAs" hidden title="Save this connection string as a named connection">Save as…</button>
    <button id="newConn" title="Save a new connection">New…</button>
    <span class="grow"></span>
    <button id="openFile" title="Open a .sql file in a sheet (Ctrl+O)">Open…</button>
    <button id="saveFile" title="Save the visible sheet (Ctrl+S). Ctrl+Shift+S saves it under a new name.">Save</button>
    <button id="newSheet" title="Open a new SQL sheet in a new tab (Ctrl+T). Each sheet has its own session.">+ New sheet</button>
    <button id="settings" title="Settings (Ctrl+,)">Settings…</button>
  </div>
  <div id="main">
    <aside id="side" aria-label="Schema browser">
      <header>
        <input id="treeFilter" type="text" placeholder="Filter tables…" spellcheck="false" aria-label="Filter tables" disabled>
        <button id="refresh" title="Reload schema" aria-label="Reload schema" disabled>⟳</button>
      </header>
      <div id="treeSummary">Not connected.</div>
      <div id="tree"></div>
    </aside>
    <div id="sidesplit" role="separator" aria-orientation="vertical" aria-label="Resize schema browser" tabindex="0" title="Drag to resize (or use the left and right arrow keys). Double-click to reset."></div>
    <div id="work">
      <div class="tabstrip">
        <div id="tabs" role="tablist" aria-label="Sheets"></div>
        <button id="newTab" title="New sheet (Ctrl+T)" aria-label="New sheet">+</button>
      </div>
      <div id="sheets"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
