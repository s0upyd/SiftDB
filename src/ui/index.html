<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SiftDB</title>
  <style>
    :root { --bg:#fff; --fg:#1f2328; --dim:#57606a; --panel:#f6f8fa; --line:#d0d7de; --accent:#0969da; --tab:#eaeef2; }
    :root[data-theme="dark"] { --bg:#0d1117; --fg:#e6edf3; --dim:#8b949e; --panel:#151b23; --line:#30363d; --accent:#4493f8; --tab:#1c232c; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font: 13px "Segoe UI", sans-serif; }
    button { padding: 4px 12px; cursor: pointer; }
    input, textarea, button { color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
    button:disabled, input:disabled { opacity: 0.5; cursor: default; }
    [hidden] { display: none !important; }

    /* The app toolbar: the connection, and opening sheets. */
    .bar { display: flex; gap: 8px; align-items: center; padding: 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
    .bar input[type=text] { flex: 1; min-width: 0; padding: 4px 6px; }

    #main { flex: 1; min-height: 0; display: flex; }
    #side { width: 300px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--bg); }
    #side header { display: flex; gap: 6px; align-items: center; padding: 6px 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
    #side header input { flex: 1; min-width: 0; padding: 3px 6px; }
    #refresh { padding: 3px 8px; }
    #treeSummary { padding: 4px 8px; color: var(--dim); font-size: 12px; border-bottom: 1px solid var(--line); }
    #tree { flex: 1; min-height: 0; overflow: auto; padding: 4px 0; }
    .row { display: flex; gap: 6px; align-items: center; padding: 2px 8px; white-space: nowrap; cursor: default; user-select: none; }
    .row:hover { background: var(--panel); }
    .twisty { width: 12px; flex: none; color: var(--dim); }
    .dim { color: var(--dim); }
    .badge { font-size: 10px; line-height: 14px; padding: 0 4px; border: 1px solid var(--line); border-radius: 3px; color: var(--dim); }

    /* The right-hand area: a strip of sheet tabs, and the visible sheet filling the rest. */
    #work { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .tabstrip { display: flex; align-items: flex-end; gap: 2px; padding: 4px 6px 0; background: var(--panel); border-bottom: 1px solid var(--line); }
    /* Tabs shrink to a minimum width, then the strip scrolls (mouse wheel) with no scrollbar. overflow-x:auto forces overflow-y
       to auto too, so the strip is told to clip vertically; its bottom padding gives the active tab's 1px overlap room. */
    #tabs { display: flex; align-items: flex-end; gap: 2px; min-width: 0; margin-bottom: -1px; padding-bottom: 1px;
            overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
    #tabs::-webkit-scrollbar, .resulttabs::-webkit-scrollbar { display: none; }
    .tab { display: flex; align-items: center; gap: 6px; padding: 5px 4px 5px 12px; flex: 0 1 auto; min-width: 116px; max-width: 220px; white-space: nowrap; cursor: pointer;
           background: var(--tab); border: 1px solid var(--line); border-bottom: none; border-radius: 6px 6px 0 0; color: var(--dim); }
    .tab[aria-selected="true"] { background: var(--bg); color: var(--fg); font-weight: 600; margin-bottom: -1px; padding-bottom: 6px; }
    .tab .title { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .tab .close, .rtab .close, .rtab .pin { border: none; background: transparent; padding: 0 5px; line-height: 1; color: var(--dim); border-radius: 3px; }
    .tab .close { font-size: 16px; }
    .tab .close:hover, .rtab .close:hover, .rtab .pin:hover { background: var(--line); color: var(--fg); }
    #newTab { flex: none; border: none; background: transparent; font-size: 18px; line-height: 1; padding: 2px 10px 6px; color: var(--dim); }
    #newTab:hover { color: var(--fg); }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .dot.tx-open { background: var(--tx-open); }
    .dot.tx-changed { background: var(--tx-changed); }
    .dot.tx-failed { background: var(--tx-failed); }

    #sheets { flex: 1; min-height: 0; position: relative; }
    .sheet { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
    .sheetbar { display: flex; gap: 8px; align-items: center; padding: 6px 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
    .sheetbar .bench { margin-left: auto; }

    /* Transaction bar (design section 7). State is shown three ways: colour, icon and words. */
    :root { --tx-open: #1a7f37; --tx-changed: #9a6700; --tx-failed: #cf222e;
            --tx-open-bg: #dafbe1; --tx-changed-bg: #fff8c5; --tx-failed-bg: #ffebe9; }
    :root[data-theme="dark"] { --tx-open: #3fb950; --tx-changed: #d29922; --tx-failed: #f85149;
            --tx-open-bg: #12261e; --tx-changed-bg: #272115; --tx-failed-bg: #2d1214; }
    .txbar { display: flex; align-items: center; gap: 10px; padding: 5px 10px; border-bottom: 1px solid var(--line);
             border-left: 5px solid var(--accent); }
    .txbar.tx-open    { background: var(--tx-open-bg);    border-left-color: var(--tx-open); }
    .txbar.tx-changed { background: var(--tx-changed-bg); border-left-color: var(--tx-changed); }
    .txbar.tx-failed  { background: var(--tx-failed-bg);  border-left-color: var(--tx-failed); }
    .txbar.tx-open .txIcon    { color: var(--tx-open); }
    .txbar.tx-changed .txIcon { color: var(--tx-changed); }
    .txbar.tx-failed .txIcon  { color: var(--tx-failed); }
    .txIcon { font-size: 15px; width: 1.2em; text-align: center; }
    .txDetail { color: var(--dim); }
    .txbar .grow { flex: 1; }

    .editor { height: 190px; min-height: 80px; resize: vertical; overflow: hidden; border-bottom: 1px solid var(--line); flex: none; }
    .run-glyph { cursor: pointer; }
    .run-glyph::before { content: "▶"; display: flex; align-items: center; justify-content: center; height: 100%;
                         font-size: 10px; color: var(--accent); }
    /* Greyed quotes the editor adds in Assisted mode. Monaco's token colours are more specific, hence the selector. */
    .monaco-editor .view-line .sift-ghost { color: var(--dim) !important; opacity: 0.85; }
    .current-statement { background: color-mix(in srgb, var(--accent) 10%, transparent); }

    .msg { padding: 5px 10px; color: var(--dim); background: var(--panel); border-bottom: 1px solid var(--line); }

    /* Results: a tab per statement, labelled with the start of its SQL. Pinning keeps one past the next run. */
    .resulttabs { display: flex; align-items: flex-end; gap: 2px; padding: 4px 6px 1px; background: var(--panel); box-shadow: inset 0 -1px 0 var(--line);
                  min-height: 5px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; flex: none; }
    .rtab { display: flex; align-items: center; gap: 2px; padding: 3px 3px 3px 10px; flex: 0 1 auto; min-width: 136px; max-width: 260px; white-space: nowrap; cursor: pointer; font-size: 12px;
            background: var(--tab); border: 1px solid var(--line); border-bottom: none; border-radius: 5px 5px 0 0; color: var(--dim); }
    .rtab[aria-selected="true"] { background: var(--bg); color: var(--fg); margin-bottom: -1px; padding-bottom: 4px; }
    .rtab .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-family: Consolas, monospace; }
    .rtab .pin, .rtab .close { flex: none; }
    .rtab .pin { font-size: 11px; opacity: 0.4; }
    .rtab .pin[aria-pressed="true"] { opacity: 1; }
    .results { flex: 1; min-height: 0; position: relative; }
    .results .empty { padding: 16px; color: var(--dim); }
    .resultpanel { position: absolute; inset: 0; display: flex; flex-direction: column; }
    .stats { padding: 6px 8px; background: var(--panel); border-bottom: 1px solid var(--line); color: var(--dim);
             font: 12px Consolas, monospace; white-space: pre-wrap; min-height: 3.6em; flex: none; }
    .grid { flex: 1; min-height: 0; }
  </style>
</head>
<body>
  <div class="bar">
    <input id="conn" type="text" placeholder="Host=localhost;Username=postgres;Password=…;Database=postgres" spellcheck="false" aria-label="Connection string">
    <button id="connect">Connect</button>
    <button id="newSheet" title="Open a new SQL sheet in a new tab (Ctrl+T). Each sheet has its own session.">+ New sheet</button>
  </div>
  <div id="main">
    <aside id="side" aria-label="Schema browser">
      <header>
        <input id="treeFilter" type="text" placeholder="Filter tables…" spellcheck="false" aria-label="Filter tables" disabled>
        <button id="refresh" title="Reload schema" aria-label="Reload schema" disabled>⟳</button>
      </header>
      <div id="treeSummary">Not connected.</div>
      <div id="tree"></div>
    </aside>
    <div id="work">
      <div class="tabstrip">
        <div id="tabs" role="tablist" aria-label="Sheets"></div>
        <button id="newTab" title="New sheet (Ctrl+T)" aria-label="New sheet">+</button>
      </div>
      <div id="sheets"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
