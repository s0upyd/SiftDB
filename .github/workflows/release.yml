# Builds the installer and update packages and publishes them as a GitHub Release (design section 9), with release notes
# generated from the commit messages (design section 14, F17; cliff.toml).
#
# To release: Actions > Release > Run workflow on main. The version is worked out from the commits since the last
# release (anything with "!" bumps major, any feat minor, anything else patch), or chosen with "bump". The workflow
# writes the notes and CHANGELOG.md, commits CHANGELOG.md and tags that commit, builds (the app bundles CHANGELOG.md for
# What's New), and publishes. If nothing user-visible has changed since the last release it stops and says so.
# The beta channel gets X.Y.Z-beta.N, with the changes since the last release of either kind; a stable release has
# everything since the last stable one, its betas' changes included. Pushing a tag by hand (v0.2.0, v0.2.0-beta.1) still
# releases that tag.
# Installed copies find new releases here by themselves (src/SiftDB.Host/Updater.cs).
name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel
        type: choice
        options: [stable, beta]
        default: stable
      bump:
        description: Version bump (auto works it out from the commit messages)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
  push:
    tags: ['v*']

permissions:
  contents: write   # commit CHANGELOG.md, push the tag, create the release and upload its files

concurrency:
  group: release
  cancel-in-progress: false

env:
  GIT_CLIFF: git-cliff@2.10.1

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # every commit and tag: the notes cover everything since the last release

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: Version, release notes and CHANGELOG.md
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts | Out-Null
          # git-cliff, pinned, from npm into the runner's temp folder, and its own executable called directly. Not through
          # npx: npm takes the options written after the package name as its own, so git-cliff never got them.
          $tools = Join-Path $env:RUNNER_TEMP 'git-cliff'
          npm install --prefix $tools --no-save --no-audit --no-fund $env:GIT_CLIFF | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "installing git-cliff failed" }
          $exe = Join-Path $tools 'node_modules/git-cliff-windows-x64/bin/git-cliff.exe'
          if (-not (Test-Path $exe)) { throw "git-cliff is not where it should be: $exe" }
          & $exe --version
          # A stable release covers everything since the last stable one: beta tags in between are passed over (they are
          # pre-releases of it), so its notes and its CHANGELOG.md section hold the betas' changes too. A beta covers what
          # changed since the last release of either kind.
          $stableRun = if ('${{ github.event_name }}' -eq 'push') { -not '${{ github.ref_name }}'.Contains('-') } else { '${{ inputs.channel }}' -eq 'stable' }
          $skipBetas = if ($stableRun) { @('--ignore-tags', '-') } else { @() }
          function Cliff { & $exe @skipBetas @args; if ($LASTEXITCODE -ne 0) { throw "git-cliff failed" } }

          if ('${{ github.event_name }}' -eq 'push') {
            # A tag pushed by hand: release exactly that tag, with its notes.
            $tag = '${{ github.ref_name }}'
            Cliff --current --strip all -o artifacts/notes.md
            Cliff -o CHANGELOG.md
          } else {
            # What this release covers, as a plain git range (not git-cliff's own idea of "unreleased", which starts at
            # the newest tag of any kind): a stable release, everything since the last stable one; a beta, everything
            # since the last release of either kind.
            $tags = git tag --list 'v*' | Where-Object { $_ -match '^v\d+\.\d+\.\d+(-.+)?$' }
            $stable = $tags | Where-Object { $_ -notmatch '-' } | Sort-Object { [version]$_.TrimStart('v') } | Select-Object -Last 1
            $previous = if ($stableRun) { $stable } else { git describe --tags --abbrev=0 --match 'v*' 2>$null }
            $range = if ($previous) { "$previous..HEAD" } else { 'HEAD' }
            Write-Host "Covering $range"

            # Nothing user-visible in it (only the types cliff.toml leaves out): stop, and say so.
            $hidden = '^(chore|ci|build|test|docs|refactor|style)(\(|:|!)|^Merge '
            $visible = @(git log $range --format=%s | Where-Object { $_ -notmatch $hidden })
            if ($visible.Count -eq 0) {
              "::notice::Nothing to release: no user-visible commits in $range."
              "release=false" >> $env:GITHUB_OUTPUT
              exit 0
            }

            # The version: from the last stable release, by the commits since it (or as chosen).
            $base = if ($stable) { [version]$stable.TrimStart('v') } else { [version]'0.0.0' }
            $since = if ($stable) { "$stable..HEAD" } else { 'HEAD' }
            $subjects = git log $since --format=%s
            $bump = '${{ inputs.bump }}'
            if ($bump -eq 'auto') {
              $bump = if ($subjects -match '^[a-z]+(\([^)]*\))?!:') { 'major' } elseif ($subjects -match '^feat') { 'minor' } else { 'patch' }
            }
            $next = switch ($bump) {
              'major' { "$($base.Major + 1).0.0" }
              'minor' { "$($base.Major).$($base.Minor + 1).0" }
              default { "$($base.Major).$($base.Minor).$($base.Build + 1)" }
            }
            if ('${{ inputs.channel }}' -eq 'beta') {
              $n = @(git tag --list "v$next-beta.*").Count + 1
              $next = "$next-beta.$n"
            }
            $tag = "v$next"
            Write-Host "Releasing $tag ($bump)"

            Cliff $range --tag $tag --strip all -o artifacts/notes.md
            # There are user-visible commits, so notes without an entry mean git-cliff read the range differently: stop
            # here, before anything is committed, tagged or pushed.
            if (-not (Select-String -Path artifacts/notes.md -Pattern '^- ' -Quiet)) {
              Get-Content artifacts/notes.md
              throw "The release notes for $range came out empty, though it has $($visible.Count) user-visible commits."
            }
            Cliff --tag $tag -o CHANGELOG.md

            # CHANGELOG.md is kept in the repository as the record; the tag points at the commit that has it.
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add CHANGELOG.md
            git commit -m "chore(release): $tag [skip ci]"
            git tag $tag
            git push origin HEAD:${{ github.ref_name }}
            git push origin $tag
          }

          $version = $tag.TrimStart('v')
          $channel = if ($version.Contains('-')) { 'beta' } else { 'win' }
          "release=true" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          Get-Content artifacts/notes.md

      - name: Build and pack
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build/release.ps1 -Version ${{ steps.version.outputs.version }} -Channel ${{ steps.version.outputs.channel }} -DownloadPrevious -ReleaseNotes artifacts/notes.md

      - name: Publish the GitHub Release
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $args_ = @('vpk', 'upload', 'github', '--repoUrl', 'https://github.com/${{ github.repository }}',
                     '--token', '${{ secrets.GITHUB_TOKEN }}', '-o', 'artifacts/releases',
                     '--channel', '${{ steps.version.outputs.channel }}',
                     '--tag', '${{ steps.version.outputs.tag }}', '--releaseName', 'SiftDB ${{ steps.version.outputs.version }}',
                     '--publish')
          if ('${{ steps.version.outputs.channel }}' -ne 'win') { $args_ += '--pre' }
          dotnet @args_
          if ($LASTEXITCODE -ne 0) { throw "vpk upload failed" }
          # The release's description is the generated notes.
          gh release edit '${{ steps.version.outputs.tag }}' --notes-file artifacts/notes.md
          if ($LASTEXITCODE -ne 0) { throw "setting the release notes failed" }
